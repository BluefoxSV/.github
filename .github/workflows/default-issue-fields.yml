name: Default issue fields and ERP project

# - Priority=P1 and Points=1 when missing on Story/Task
# - Add issue to org Project ERP (BluefoxSV/19)
# Sprint is left empty so items land in the general pool until planning.
#
# Uses the org GitHub App (vars.BOT_CLIENT_ID + secrets.BOT_PRIVATE_KEY) for issue
# fields and Project ERP. GITHUB_TOKEN and PROJECTS_TOKEN are limited.
on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON string or array accepted by runs-on.
        required: true
        type: string
    secrets:
      BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  defaults:
    name: Defaults + ERP project
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    steps:
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Ensure gh CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already installed: $(gh --version | head -1)"
            exit 0
          fi
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gh

      - name: Apply Priority/Points if unset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TYPE: ${{ github.event.issue.type.name }}
          API_VERSION: "2026-03-10"
          PRIORITY_FIELD_ID: "45503977"
          POINTS_FIELD_ID: "45504128"
          DEFAULT_PRIORITY: "P1"
          DEFAULT_POINTS: "1"
        run: |
          set -euo pipefail

          if [[ "${ISSUE_TYPE:-}" != "Story" && "${ISSUE_TYPE:-}" != "Task" ]]; then
            echo "Skip fields: type=${ISSUE_TYPE:-none}"
            exit 0
          fi

          current="$(gh api \
            "repos/${OWNER}/${REPO}/issues/${ISSUE}/issue-field-values" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${API_VERSION}")"

          has_priority="$(echo "$current" | jq -r --arg id "$PRIORITY_FIELD_ID" \
            '[.[] | select((.issue_field_id|tostring) == $id)] | length > 0')"
          has_points="$(echo "$current" | jq -r --arg id "$POINTS_FIELD_ID" \
            '[.[] | select((.issue_field_id|tostring) == $id)] | length > 0')"

          payload='[]'
          if [[ "$has_priority" != "true" ]]; then
            payload="$(echo "$payload" | jq -c \
              --argjson fid "$PRIORITY_FIELD_ID" \
              --arg val "$DEFAULT_PRIORITY" \
              '. + [{field_id: $fid, value: $val}]')"
            echo "Will set Priority=${DEFAULT_PRIORITY}"
          fi
          if [[ "$has_points" != "true" ]]; then
            payload="$(echo "$payload" | jq -c \
              --argjson fid "$POINTS_FIELD_ID" \
              --arg val "$DEFAULT_POINTS" \
              '. + [{field_id: $fid, value: $val}]')"
            echo "Will set Points=${DEFAULT_POINTS}"
          fi

          if [[ "$payload" == "[]" ]]; then
            echo "Fields already set"
            exit 0
          fi

          echo "{\"issue_field_values\": ${payload}}" | gh api \
            --method POST \
            "repos/${OWNER}/${REPO}/issues/${ISSUE}/issue-field-values" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            --input -

          echo "Defaults applied on #${ISSUE}"

      - name: Add to ERP project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TYPE: ${{ github.event.issue.type.name }}
          PROJECT_OWNER: BluefoxSV
          PROJECT_NUMBER: "19"
        run: |
          set -euo pipefail

          if [[ "${ISSUE_TYPE:-}" != "Story" && "${ISSUE_TYPE:-}" != "Task" ]]; then
            echo "Skip project: type=${ISSUE_TYPE:-none}"
            exit 0
          fi

          gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" \
            || echo "item-add skipped/failed (may already be on project)"
